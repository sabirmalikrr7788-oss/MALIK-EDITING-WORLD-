<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | MALIK EDITING WORLD</title><link rel="stylesheet" href="/style.css"></head><body class="admin-body"><header class="nav"><a class="brand" href="/"><span class="brand-mark">M</span><span>MALIK <i>EDITING WORLD</i></span></a><a class="nav-link" href="/">View Website ↗</a></header><main class="admin-wrap"><div id="loginBox" class="panel narrow"><p class="eyebrow">SECURE ACCESS</p><h1>Admin <em>Login</em></h1><p class="muted">Sign in to manage your public catalog.</p><form id="loginForm"><label>Admin User ID<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="gold-btn" type="submit">Login to Dashboard</button><p class="status" id="loginStatus"></p></form></div>
<div id="dashboard" hidden><div class="admin-title"><div><p class="eyebrow">CONTROL ROOM</p><h1>Catalog <em>Dashboard</em></h1><p class="muted">Upload new AI work. Visitors can view it on the homepage.</p></div><button class="outline-btn" id="logout">Log out</button></div><div class="panel"><h2>Upload New Work</h2><form id="uploadForm" class="upload-form"><label>Work Title<input name="title" placeholder="e.g. Royal Black Saree Photoshoot" maxlength="120" required></label><label>Category<select name="category"><option>AI Saree Photoshoot</option><option>AI Saree Video</option><option>Outdoor Model Shoot</option><option>Studio Photoshoot</option><option>Creative AI Editing</option></select></label><label class="full">Description<textarea name="description" rows="3" placeholder="Short details (optional)"></textarea></label><label class="full">Choose Image or Video<input name="media" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" required><small>Max file size: 100 MB. Supported: JPG, PNG, WEBP, GIF, MP4, WEBM, MOV.</small></label><button class="gold-btn" type="submit">＋ Publish to Catalog</button><p class="status full" id="uploadStatus"></p></form></div><div class="panel"><h2>Published Work</h2><div id="adminItems" class="admin-list"></div></div></div></main><footer><span>© MALIK EDITING WORLD</span><span>ADMIN PANEL</span></footer><script src="/admin.js"></script></body></html>
